[project]
name = "veridian"
version = "0.1.0"
description = "An open-source, plugin-native runtime for coding agents. Every subsystem is a replaceable brick."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ye-Yint-Nyo-Hmine", email = "yeyintnyohmine143@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.21",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
]
# Real provider SDKs, needed only to run the inference bricks (and their live tests).
providers = [
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.scripts]
veridian = "veridian.cli.main:run"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that require a real inference provider (API key or local server). Deselected by default.",
    "install: tests that resolve real brick environments over the network with uv/npm. Deselected by default.",
    "container: tests that need a container engine (docker/podman) on PATH. Deselected by default.",
]
addopts = "-m 'not live and not install and not container'"

[tool.uv]
package = true

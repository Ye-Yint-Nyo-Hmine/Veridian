name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hermetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: Hermetic test suite (no provider configured)
        run: uv run pytest -m "not live"
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""

  install:
    # Per-brick dependency isolation (Milestone 2 / A1): resolves real brick environments with
    # `uv` over the network, so it runs as its own job rather than in the hermetic matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: Dependency-isolation suite (resolves real environments with uv)
        run: uv run pytest -m install
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""

  container:
    # Container spawn mode (Milestone 2 / A2): needs a real Docker engine, which the GitHub
    # ubuntu runners provide. Pulls a small python image, so it runs as its own job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: Container-isolation suite (spawns bricks in Docker)
        run: uv run pytest -m container
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""

  live:
    # Manually triggered only. Uses repository secrets.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: Live provider suite
        run: uv run pytest -m live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

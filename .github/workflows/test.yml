name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hermetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: Hermetic test suite (no provider configured)
        run: uv run pytest -m "not live"
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""

  live:
    # Manually triggered only. Uses repository secrets.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: Live provider suite
        run: uv run pytest -m live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

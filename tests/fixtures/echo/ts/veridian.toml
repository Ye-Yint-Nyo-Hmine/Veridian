name = "echo/ts"
version = "1.0.0"
description = "The echo fixture contract implemented with the TypeScript SDK, run via node type-strip."
protocol = "veridian/1.0"
runtime = "node"

[spawn]
command = ["${node}", "--experimental-strip-types", "brick.ts"]

[[implements]]
contract = "echo"
methods = ["say", "stream", "roundtrip"]

[capabilities]
requires = ["contract:echo"]

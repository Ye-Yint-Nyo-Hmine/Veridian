name = "echo/roundtrip"
version = "1.0.0"
description = "Calls back into the kernel via host.contract.call and host.permission.request."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[[implements]]
contract = "echo"
methods = ["say", "stream", "via_host", "needs_perm"]

[capabilities]
requires = ["contract:echo", "network"]

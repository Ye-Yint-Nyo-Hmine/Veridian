name = "echo/sdk"
version = "1.0.0"
description = "The echo fixture contract implemented with the Python SDK."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[[implements]]
contract = "echo"
methods = ["say", "stream", "roundtrip"]

[capabilities]
requires = ["contract:echo"]

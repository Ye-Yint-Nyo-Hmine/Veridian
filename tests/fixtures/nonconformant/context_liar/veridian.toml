name = "nonconformant/context-liar"
version = "0.0.1"
description = "Claims the context contract but returns schema-invalid results. The conformance harness must reject it."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[[implements]]
contract = "context"
methods = ["index", "retrieve", "invalidate"]

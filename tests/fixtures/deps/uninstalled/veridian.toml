name = "deps/uninstalled"
version = "0.1.0"
description = "Dependency-isolation fixture: declares a pin but is never installed, so it must be refused at spawn."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[[implements]]
contract = "tools"
methods = ["list", "invoke"]

[dependencies]
python = ["six==1.15.0"]

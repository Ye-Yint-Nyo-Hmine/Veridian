name = "example/linear-agent"
version = "0.1.0"
description = "A different agent architecture: plan once, then run every step to completion with no re-planning. Bind it to `orchestrator` and the whole agent changes."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[capabilities]
requires = ["contract:inference", "contract:context", "contract:planner", "contract:tools"]

[[implements]]
contract = "orchestrator"
methods = ["run"]

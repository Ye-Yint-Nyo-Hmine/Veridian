name = "example/jsonl-memory"
version = "0.1.0"
description = "A custom memory brick backed by a single JSONL file. Human-readable, git-diffable."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[capabilities]
requires = ["workspace:write"]

[[implements]]
contract = "memory"
methods = ["write", "read", "search", "forget"]

name = "example/thread-sandbox"
version = "0.1.0"
description = "A second sandbox implementation (subprocess.run in a worker thread). Swap proof for the sandbox contract."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[capabilities]
requires = ["process:spawn"]

[[implements]]
contract = "sandbox"
methods = ["exec", "spawn", "write", "kill", "reset"]

name = "example/retry-inference"
version = "0.1.0"
description = "An inference ENGINE (not a provider): composes the model_provider contract and retries once on failure."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[capabilities]
requires = ["contract:model_provider"]

[[implements]]
contract = "inference"
methods = ["generate", "generate_stream", "models"]

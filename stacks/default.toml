# The default stack: cloud inference (Anthropic), heuristic context, ephemeral memory,
# linear planning, a local sandbox, and filesystem tools, driven by the default orchestrator.
#
# Swap any single line below and the kernel is untouched — that is the whole claim.

[stack]
name = "default"
description = "Anthropic inference + heuristic context + local sandbox + filesystem tools."

[policy]
grant = [
  "network",
  "process:spawn",
  "workspace:read",
  "workspace:write",
  "contract:inference",
  "contract:context",
  "contract:planner",
  "contract:tools",
  "contract:memory",
  "contract:sandbox",
  "contract:conversation",
]

[bindings]
inference = { brick = "bricks/inference/anthropic", config = { model = "claude-opus-5", max_tokens = 2048 } }
context = "bricks/context/default"
planner = "bricks/planning/default"
memory = "bricks/memory/ephemeral"
sandbox = "bricks/sandbox/local"
tools = "bricks/tools/filesystem"
conversation = "bricks/conversation/sqlite"
orchestrator = "bricks/orchestrator/default"

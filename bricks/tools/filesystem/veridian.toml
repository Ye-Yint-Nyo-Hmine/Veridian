name = "tools/filesystem"
version = "0.1.0"
description = "Filesystem tools (read, write, list, search) confined to the workspace root."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[[implements]]
contract = "tools"
methods = ["list", "invoke"]

[capabilities]
requires = ["workspace:read", "workspace:write"]

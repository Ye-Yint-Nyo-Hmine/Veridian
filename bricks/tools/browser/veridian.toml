name = "tools/browser"
version = "0.1.0"
description = "Headless browser tools. Playwright is an optional dependency; reports unavailable if absent."
protocol = "veridian/1.0"
runtime = "python"
optional_dependencies = ["playwright"]

[spawn]
command = ["${python}", "brick.py"]

[capabilities]
requires = ["network"]

[[implements]]
contract = "tools"
methods = ["list", "invoke"]

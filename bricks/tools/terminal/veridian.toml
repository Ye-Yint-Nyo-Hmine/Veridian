name = "tools/terminal"
version = "0.1.0"
description = "A run_command tool that executes through the bound sandbox brick via host.contract.call."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[[implements]]
contract = "tools"
methods = ["list", "invoke"]

[capabilities]
requires = ["contract:sandbox"]

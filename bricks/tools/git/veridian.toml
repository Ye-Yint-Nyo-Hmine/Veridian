name = "tools/git"
version = "0.1.0"
description = "Git tools (status, diff, log, add, commit). Written in TypeScript against @veridian/sdk."
protocol = "veridian/1.0"
runtime = "node"

[spawn]
command = ["${node}", "--experimental-strip-types", "src/brick.ts"]

[[implements]]
contract = "tools"
methods = ["list", "invoke"]

[capabilities]
requires = ["process:spawn", "workspace:read", "workspace:write"]

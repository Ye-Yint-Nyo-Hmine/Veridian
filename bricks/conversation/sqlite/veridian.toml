name = "conversation/sqlite"
version = "0.1.0"
description = "Local chat history in a single SQLite file under the workspace. Append-only turn log per session. Nothing leaves the device."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[capabilities]
requires = ["workspace:write"]

[[implements]]
contract = "conversation"
methods = ["append", "load", "list_sessions", "delete"]

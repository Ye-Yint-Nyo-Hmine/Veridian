name = "memory/graph"
version = "0.1.0"
description = "SQLite memory with an edge table. Search returns matches plus their one-hop neighbours."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[[implements]]
contract = "memory"
methods = ["write", "read", "search", "forget"]

[capabilities]
requires = ["workspace:write"]

name = "memory/vector"
version = "0.1.0"
description = "SQLite-backed memory. Search uses embeddings from the model_provider contract, with a keyword fallback."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[[implements]]
contract = "memory"
methods = ["write", "read", "search", "forget"]

[capabilities]
requires = ["workspace:write", "contract:model_provider"]

name = "context/graph"
version = "0.1.0"
description = "Import and definition graph for Python sources, built with the standard-library ast module."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[[implements]]
contract = "context"
methods = ["index", "retrieve", "invalidate"]

[capabilities]
requires = ["workspace:read"]

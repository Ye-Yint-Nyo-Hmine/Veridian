name = "context/semantic"
version = "0.1.0"
description = "Keyword pre-filter, then an inference call reranks the candidates."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[[implements]]
contract = "context"
methods = ["index", "retrieve", "invalidate"]

[capabilities]
requires = ["workspace:read", "contract:inference"]

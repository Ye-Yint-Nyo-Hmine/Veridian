name = "context/vector"
version = "0.1.0"
description = "Embedding retrieval: chunks embedded through the model_provider contract, stored in SQLite, ranked by cosine."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[[implements]]
contract = "context"
methods = ["index", "retrieve", "invalidate"]

[capabilities]
requires = ["workspace:read", "workspace:write", "contract:model_provider"]

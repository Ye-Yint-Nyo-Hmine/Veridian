name = "sandbox/local"
version = "0.1.0"
description = "Local subprocess execution with working-directory confinement, timeouts, and output caps."
protocol = "veridian/1.0"
runtime = "python"

[spawn]
command = ["${python}", "brick.py"]

[[implements]]
contract = "sandbox"
methods = ["exec", "spawn", "write", "kill", "reset"]

[capabilities]
requires = ["process:spawn", "workspace:read", "workspace:write"]
